<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mr. Potato Head</title>
</head>
<body>

    <h1>Mr. Potato Head!</h1>

    <button id="resetButton">Start Over</button>

    <div id="gameArea">
        <img class="potato" src="/images/potato.png" alt="Mr. Potato Head">
    </div>


    <h3>Choose your pieces!</h3>

    <div id="gamePieces">
        <img src="/images/BigSmile.png" alt="big smile">
        <img src="/images/Glossy Pink Toy Ears.png" alt="pink ears">
        <img src="/images/musMan.png" alt="mustache">
        <img src="/images/purEyes.png" alt="purple eyes">
        <img src="/images/redLips.png" alt="red lips">
        <img src="/images/redNose.png" alt="red nose">
    </div>

    <h3>Music</h3>
    <audio controls loop>
        <source src="/music.mp3" type="audio/mpeg">
    </audio>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
      <style>
        html, body, #map{
        width: 100%;
        height: 100%;
        margin: 0;
        }
          #input {
    position: absolute;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
        background-color: white;
        padding: 15px;
        border-radius: 10px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }

    #input p {
        margin-top: 0;
    }

    #input input {
        padding: 8px;
        margin-right: 5px;
    }

    #input button {
        padding: 8px 15px;
        cursor: pointer;
    }
    #sidebar {
    position: absolute;
    top: 0;
    left: 0;
    width: 280px;
    height: 100%;
    background-color: white;
    padding: 20px;
    box-sizing: border-box;
    z-index: 10;
    display: none;
}

#resultsList {
    list-style: none;
    padding: 0;
}

#resultsList li {
    padding: 10px;
    border-bottom: 1px solid #ddd;
    cursor: pointer;
}

#resultsList li:hover {
    background-color: #f0f0f0;
}

#sidebarSearch {
    position: absolute;
    bottom: 20px;
    left: 20px;
    right: 20px;
}

#sidebarSearch input {
    width: 100%;
    box-sizing: border-box;
    margin-bottom: 8px;
}

#sidebarSearch button {
    width: 100%;
}
    </style>
</head>
<body>
    <div id="input">
    <p >Search for a place you'd like to learn about!</p>
    <input type="text" id="searchTerm" >
    <button id="searButton">Search</button>
    </div>
    <div id="map"></div>
    <div id="sidebar">
    <h2>Search Results</h2>

    <ul id="resultsList">
    </ul>
    <p id="errorMessage"></p>

    <div id="sidebarSearch">

</div>
